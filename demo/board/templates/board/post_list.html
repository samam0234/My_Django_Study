{% extends 'base.html' %}

{% block title %}게시글 목록{% endblock %}

{% block content %}
<h1>게시글 목록</h1>
<p><a href="{% url 'board:post_create' %}">+ 새 글 작성</a></p>

<table>
    <thead>
        <tr><th>제목</th><th>작성자</th><th>작성일</th></tr>
    </thead>
    <tbody>
        {% for post in posts %}
        <tr>
            <td><a href="{% url 'board:post_detail' post.pk %}">{{ post.title }}</a></td>
            <td>{{ post.author }}</td>
            <td>{{ post.created_at|date:'Y-m-d H:i' }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">등록된 게시글이 없습니다.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
