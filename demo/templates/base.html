<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Django 게시판{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 720px; margin: 40px auto; color: #222; }
        nav { margin-bottom: 24px; border-bottom: 1px solid #ddd; padding-bottom: 12px; }
        nav a { margin-right: 12px; text-decoration: none; color: #2563eb; }
        .messages { list-style: none; padding: 0; }
        .messages li { background: #eef6ff; padding: 8px 12px; border-radius: 4px; margin-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
        .actions a, .actions button { margin-right: 8px; }
        form p { margin: 8px 0; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'board:post_list' %}">게시판</a>
        {% if user.is_authenticated %}
            <span>{{ user.nickname|default:user.username }}님</span>
            <form action="{% url 'accounts:logout' %}" method="post" style="display:inline">
                {% csrf_token %}
                <button type="submit">로그아웃</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">로그인</a>
            <a href="{% url 'accounts:signup' %}">회원가입</a>
        {% endif %}
    </nav>

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
